name: ABAP 점검

# Gate 3 자가검증을 사람 손이 아니라 CI에서도 확인한다.
# 저장소에 들어오는 모든 .abap 산출물은 오류 0건이어야 한다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  abap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 점검기 자체 테스트
        run: python3 tools/tests/test_abap_check.py

      - name: 저장소 ABAP 산출물 점검 (오류 0건)
        run: python3 tools/abap_check.py examples sessions

      - name: 코드 골격 점검 (오류·경고 0건)
        run: python3 tools/abap_check.py templates --fail-on warning

      - name: 세션 스캐폴딩 스크립트 점검
        run: |
          bash -n tools/new_session.sh
          tools/new_session.sh ZCI_SMOKE_TEST 20260101 > /dev/null
          test -f sessions/20260101-ZCI_SMOKE_TEST/00-intake.filled.md
          rm -rf sessions/20260101-ZCI_SMOKE_TEST

      - name: 템플릿 교체 지점 잔류 검사 (세션 코드)
        run: |
          # 세션 산출물에 골격의 TODO(교체)가 남아 있으면 미완성 코드다.
          if grep -rn "TODO(교체)" sessions/ 2>/dev/null; then
            echo "세션 코드에 TODO(교체)가 남아 있습니다 — 세션 값으로 교체하십시오."
            exit 1
          fi
          echo "잔류 없음"
