<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 프로그램 세션 시작 — 클릭 선택</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; background: #f7f7f8; color: #222; }
  h1 { font-size: 20px; }
  .q { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .q h2 { font-size: 16px; margin: 0 0 10px; }
  .opt { display: block; width: 100%; text-align: left; font-size: 15px; padding: 12px; margin: 6px 0; border: 2px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; }
  .opt.selected { border-color: #2563eb; background: #eff6ff; font-weight: bold; }
  .opt .star { color: #2563eb; }
  #result { width: 100%; min-height: 120px; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  #copyBtn { font-size: 16px; padding: 12px 20px; border-radius: 10px; border: none; background: #2563eb; color: #fff; cursor: pointer; margin-top: 10px; width: 100%; }
  .hint { font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>신규 프로그램 세션 시작 — 클릭 선택</h1>
<p class="hint">각 질문에서 하나씩 터치/클릭하세요. 다 고르면 맨 아래 <b>결과 복사</b>를 눌러 채팅에 붙여넣으세요. 기본값은 ★ 표시입니다.</p>

<div class="q" data-q="1" data-title="SAP 릴리스">
  <h2>1. SAP 릴리스</h2>
  <button class="opt" data-v="ECC 6.0/NW 7.31 이하(보수적)">① ECC 6.0 / NW 7.31 이하 (보수적)</button>
  <button class="opt" data-v="NW 7.40">② NW 7.40</button>
  <button class="opt" data-v="NW 7.50·S/4HANA(모던 허용)">③ <span class="star">★</span> NW 7.50·S/4HANA (모던 허용)</button>
  <button class="opt" data-v="모름-ECC호환">④ 모름 (ECC호환 안전값)</button>
</div>

<div class="q" data-q="2" data-title="주력 프로그램 유형(복수 선택 가능)">
  <h2>2. 주력 프로그램 유형 (복수 선택 가능)</h2>
  <button class="opt multi" data-v="ALV 리포트">★ ALV 리포트</button>
  <button class="opt multi" data-v="Function Module">★ Function Module</button>
  <button class="opt multi" data-v="Module Pool">Module Pool</button>
  <button class="opt multi" data-v="Enhancement">Enhancement (BAdI·Exit)</button>
  <button class="opt multi" data-v="Interface">Interface (RFC·파일·IDoc)</button>
  <button class="opt multi" data-v="Batch">Batch (BDC)</button>
  <button class="opt multi" data-v="Forms">Forms</button>
</div>

<div class="q" data-q="3" data-title="ALV 방식">
  <h2>3. ALV 방식</h2>
  <button class="opt" data-v="건별 유연 선택">★ 건별 유연 선택</button>
  <button class="opt" data-v="CL_SALV_TABLE 고정">CL_SALV_TABLE 고정</button>
  <button class="opt" data-v="REUSE 고정">REUSE 고정</button>
  <button class="opt" data-v="CL_GUI_ALV_GRID 고정">CL_GUI_ALV_GRID 고정</button>
</div>

<div class="q" data-q="4" data-title="워크플로우">
  <h2>4. 워크플로우</h2>
  <button class="opt" data-v="엄격 게이트">★ 엄격 게이트 (빈칸 시 코드 금지·스펙 OK 후 코드)</button>
  <button class="opt" data-v="빠른 진행">빠른 진행 (스펙+코드 한 번에)</button>
  <button class="opt" data-v="둘 다 지원">둘 다 지원</button>
</div>

<div class="q" data-q="5" data-title="ALV·FM 외 추가 유형">
  <h2>5. ALV·FM 외 추가 유형</h2>
  <button class="opt" data-v="없음-ALV+FM만">★ 없음 (ALV+FM만)</button>
  <button class="opt" data-v="Enhancement 포함">Enhancement 포함</button>
  <button class="opt" data-v="Interface·Batch 포함">Interface·Batch 포함</button>
  <button class="opt" data-v="Module Pool·Forms 포함">Module Pool·Forms 포함</button>
</div>

<div class="q" data-q="6" data-title="네이밍·패키지·메시지 규칙">
  <h2>6. 네이밍·패키지·메시지 규칙</h2>
  <button class="opt" data-v="AI 제안 규칙(Z+모듈약어)">★ AI 제안 규칙 (Z+모듈약어)</button>
  <button class="opt" data-v="사내 고정 규칙 있음">사내 고정 규칙 있음 (아래 기타란에 기입)</button>
</div>

<div class="q" data-q="7" data-title="주석 언어·한글 입력">
  <h2>7. 주석 언어·한글 입력</h2>
  <button class="opt" data-v="한국어+영문 병기">★ 한국어+영문 병기</button>
  <button class="opt" data-v="영문만">영문만 (GUI 한글 불가)</button>
  <button class="opt" data-v="한국어 위주">한국어 위주</button>
</div>

<div class="q" data-q="8" data-title="AI 도구">
  <h2>8. AI 도구</h2>
  <button class="opt" data-v="Cursor(Rules 등록)">★ Cursor (Rules 등록)</button>
  <button class="opt" data-v="ChatGPT·Claude">ChatGPT·Claude (프로젝트 지침)</button>
  <button class="opt" data-v="둘 다·사내 LLM">둘 다·사내 LLM</button>
  <button class="opt" data-v="매번 복붙">매번 복붙 (등록 안 함)</button>
</div>

<div class="q">
  <h2>기타 (사내 규칙·보충 설명, 선택)</h2>
  <input id="extra" type="text" placeholder="예: 패키지 ZSD01, 메시지 ZSD_MSG" style="width:100%;padding:12px;font-size:15px;border-radius:8px;border:1px solid #ccc;">
</div>

<h2>채팅에 붙여넣을 답변</h2>
<textarea id="result" readonly placeholder="위에서 선택하면 여기에 답변이 자동 생성됩니다."></textarea>
<button id="copyBtn">결과 복사하기</button>
<p class="hint">복사 후 이 채팅에 붙여넣어 전송하세요. 그러면 인터뷰(I-0, 3문항)로 넘어갑니다.</p>

<script>
  document.querySelectorAll('.q[data-q]').forEach(function (box) {
    var multi = box.querySelector('.multi') !== null;
    box.querySelectorAll('.opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (multi) { btn.classList.toggle('selected'); }
        else {
          box.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
        }
        build();
      });
    });
  });
  document.getElementById('extra').addEventListener('input', build);
  function build() {
    var lines = [];
    document.querySelectorAll('.q[data-q]').forEach(function (box) {
      var sel = Array.prototype.slice.call(box.querySelectorAll('.opt.selected')).map(function (b) { return b.getAttribute('data-v'); });
      lines.push(box.getAttribute('data-q') + '. ' + box.getAttribute('data-title') + ': ' + (sel.length ? sel.join(' / ') : '(미선택)'));
    });
    var extra = document.getElementById('extra').value.trim();
    if (extra) lines.push('기타: ' + extra);
    document.getElementById('result').value = lines.join('\n');
  }
  document.getElementById('copyBtn').addEventListener('click', function () {
    build();
    var t = document.getElementById('result');
    t.select();
    try { document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) { navigator.clipboard.writeText(t.value); }
    this.textContent = '복사됨! 채팅에 붙여넣으세요';
    var self = this;
    setTimeout(function () { self.textContent = '결과 복사하기'; }, 2000);
  });
  build();
</script>
</body>
</html>
